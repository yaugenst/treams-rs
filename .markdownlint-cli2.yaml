# markdownlint-cli2 configuration (pre-commit hook `markdownlint-cli2`)
# See: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
# The API reference is owned by scripts/generate_docs.py and treams_rs._catalog.
# Generic Markdown fixes can alter mathematical notation in those docstrings.
ignores:
  - docs/reference/python/**

config:
  # MD003/heading-style - Heading style
  MD003:
    style: atx  # Use # style headings

  # MD004/ul-style - Unordered list style
  MD004:
    style: dash  # Use - for unordered lists

  # Python-Markdown, used by MkDocs, requires four spaces for nested lists.
  MD007:
    indent: 4

  # MD013/line-length - Line length
  # Disabled - tables, links and generated API signatures need long lines
  MD013: false

  # MD060/table-column-style - Table column style
  # Disabled - tables use both compact and aligned column styles
  MD060: false

  # MD029/ol-prefix - Ordered list item prefix
  MD029:
    style: ordered  # Use 1. 2. 3. etc.

  # MD046/code-block-style - Code block style
  # Disabled - the generated API reference keeps docstrings' indented literal blocks
  MD046: false

  # MD048/code-fence-style - Code fence style
  MD048:
    style: backtick

  # MD049/emphasis-style - Emphasis style
  MD049:
    style: asterisk

  # MD050/strong-style - Strong style
  MD050:
    style: asterisk

  # MD053/link-image-reference-definitions - Link and image reference definitions should be needed
  MD053:
    ignored_definitions: []
