# typos spell-checker configuration (pre-commit hook `typos`)
# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
  # Generated lockfiles: package names and hashes, not prose.
  "Cargo.lock",
  "uv.lock",
  # License and copyright texts are reproduced verbatim from upstream and must
  # not be corrected (THIRD_PARTY_LICENSES.txt is generated by `just licenses`).
  "LICENSE*",
  "THIRD_PARTY_LICENSES*",
  "RUST_STDLIB_*",
  "third_party/",
  # Recorded scientific evidence is not spelling-edited.
  "benchmarks/results/",
  # The recorded conversations quote their messages verbatim.
  "docs/history/data/",
]

# Allowlist entries are scoped to the file types they occur in, so prose and
# other code still report the same strings as typos. Only `ND` and `writeable`,
# which are correct wherever they appear, are allowed in every file.

[default.extend-words]
# NumPy's `NDArray`.
ND = "ND"
# NumPy's `ndarray.flags.writeable`.
writeable = "writeable"

[type.py.extend-words]
# NumPy ufunc attribute (number of inputs).
nin = "nin"

[type.py.extend-identifiers]
# Oracle (upstream treams) T-matrix variable in the upstream comparison tests.
ot = "ot"

[type.lean.extend-identifiers]
# Lean hypothesis name (`h` + `ge`) in formal/Formal/Harmonics.lean.
hge = "hge"

[type.rust.extend-words]
# Native ufunc input count, matrix products, helicity notation and journal name.
nin = "nin"
ba = "ba"
hel = "hel"
Comput = "Comput"
