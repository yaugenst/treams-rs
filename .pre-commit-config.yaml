repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: /py\.typed$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
        args: [--maxkb=1000, --enforce-all]
        exclude: ^benchmarks/(results/|correction-plan\.json$)
      - id: check-added-large-files
        name: check benchmark artifact size
        files: ^benchmarks/(results/|correction-plan\.json$)
        args: [--maxkb=50000, --enforce-all]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-diff3-base-markers
        name: diff3 merge-base markers
        language: pygrep
        entry: '^\|{7}( |$)'
        types: [text]
      - id: cargo-fmt
        name: cargo-fmt
        entry: just rust-fmt-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: cargo-clippy
        name: cargo-clippy
        entry: just rust-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        name: ruff-format
        entry: just py-format-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-lint
        name: ruff-lint
        entry: just py-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pyrefly
        name: pyrefly
        entry: just py-types
        language: system
        pass_filenames: false
        stages: [pre-commit]
