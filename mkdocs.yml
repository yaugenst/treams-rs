site_name: treams-rs
site_description: >-
  A Rust port of treams with a Python interface and analytic gradients.
site_url: https://yaugenst.github.io/treams-rs/
repo_url: https://github.com/yaugenst/treams-rs
repo_name: yaugenst/treams-rs
edit_uri: edit/main/docs/
copyright: treams-rs contributors, MIT license
strict: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/install.md
      - getting-started/quickstart.md
  - Coming from treams:
      - coming-from-treams/index.md
      - Name map: coming-from-treams/names.md
      - coming-from-treams/conventions.md
      - coming-from-treams/differences.md
  - User guide:
      - guide/index.md
      - guide/particles-and-waves.md
      - guide/clusters.md
      - guide/large-clusters.md
      - guide/periodic.md
      - guide/planar.md
      - guide/numerical-namespaces.md
      - guide/io.md
      - guide/threads.md
      - guide/api-discovery.md
  - Examples:
      - examples/index.md
      - examples/sphere.md
      - examples/cluster.md
      - examples/chain.md
      - examples/grid.md
      - examples/crystal.md
      - examples/slab.md
      - examples/array_spheres.md
      - examples/band_structure.md
      - examples/cylinder.md
      - examples/cylindrical_chain.md
      - examples/cylindrical_cluster.md
      - examples/cylindrical_crystal.md
      - examples/grating.md
      - examples/cylindrical_array.md
      - examples/sphere_radius_optimization.md
      - examples/array_transmission_gradient.md
      - examples/forward_field_sensitivity.md
      - examples/reverse_cluster_gradient.md
  - Differentiation:
      - differentiation/index.md
      - differentiation/frameworks.md
      - differentiation/choosing-a-mode.md
      - differentiation/custom-records.md
      - differentiation/gradient-checks.md
  - Design:
      - design/index.md
      - design/python-api.md
      - design/pullbacks.md
      - design/adapters.md
      - design/floating-point.md
      - design/numerics.md
      - design/parallelism.md
      - design/formal-proofs.md
  - Validation:
      - validation/index.md
      - validation/capabilities.md
      - validation/numerical-limits.md
      - validation/published-applications.md
  - Performance:
      - performance/index.md
      - performance/cpu-speedups.md
      - performance/large-problems.md
      - performance/platform-comparison.md
      - performance/evidence.md
  - Reference:
      - reference/index.md
      - Python API:
          - reference/python/index.md
          - reference/python/treams_rs.md
          - reference/python/special.md
          - reference/python/sw.md
          - reference/python/cw.md
          - reference/python/pw.md
          - reference/python/lattice.md
          - reference/python/coeffs.md
          - reference/python/misc.md
          - reference/python/ebcm.md
          - reference/python/io.md
          - reference/python/operators.md
          - reference/python/iterative.md
          - reference/python/parallel.md
          - reference/python/diff.md
          - reference/python/testing.md
          - reference/python/advect.md
          - reference/python/jax.md
          - reference/python/torch.md
          - reference/python/autograd.md
          - reference/python/native-types.md
      - Rust crate: reference/rust.md
      - reference/glossary.md
  - Development:
      - development/index.md
      - development/architecture.md
      - development/testing.md
      - development/documentation.md
      - development/benchmarks.md
      - development/releasing.md
  - How it was built:
      - history/index.md
      - history/messages.md
      - history/conversations.md
      - history/about.md
  - Changelog: changelog.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  # Follow the system color scheme until the reader picks one.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system color scheme
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - history/history.css

extra_javascript:
  - history/history.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yaugenst/treams-rs
      name: treams-rs on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/treams-rs/
      name: treams-rs on PyPI

# The hook strips the test modes from python fences and points links that
# leave docs/ at GitHub.
hooks:
  - docs/_hooks/site.py
exclude_docs: |
  _hooks/
# Rustdoc bundles font licenses as Markdown alongside its static assets.
not_in_nav: |
  /rust/static.files/*.md
watch:
  - CHANGELOG.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
