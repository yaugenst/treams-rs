[package]
name = "treams-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional device-resident complex128 scattering linear algebra"

[features]
default = []
cuda = ["dep:cudarc", "dep:libloading"]

[dependencies]
treams-core.workspace = true
nalgebra.workspace = true
thiserror.workspace = true
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["std", "driver", "cublas", "cusolver", "dynamic-loading", "cuda-13000"] }
libloading = { version = "0.9", optional = true }

[dev-dependencies]
proptest = "1"
faer.workspace = true
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "benchmark"
required-features = ["cuda"]
