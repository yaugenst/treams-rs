[package]
name = "treams-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
faer.workspace = true
rayon.workspace = true
complex-bessel.workspace = true
errorfunctions.workspace = true
libm.workspace = true
nalgebra.workspace = true
num-complex.workspace = true
thiserror.workspace = true

# faer's native thread pool uses atomic-wait, which cannot target the browser.
# Rayon iterators in this crate use Rayon's supported serial WASM fallback.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { workspace = true, features = ["rayon"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
