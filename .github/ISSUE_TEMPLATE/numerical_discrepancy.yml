name: Numerical discrepancy
description: A treams-rs result disagrees with treams or with an independent reference.
labels: ["numerical"]
body:
  - type: checkboxes
    id: differences
    attributes:
      label: Known differences
      options:
        - label: >-
            [Differences from treams](https://yaugenst.github.io/treams-rs/latest/coming-from-treams/differences/)
            does not explain this.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What differs
      description: One or two sentences naming the quantity, for example a T-matrix, a cross section or a lattice sum.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproduce
      description: >-
        Exact shell commands or a minimal self-contained Python script that
        computes both the treams-rs and the reference result.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: >-
        The reference value and its source (treams version or independent
        method), the treams-rs value, and the tolerance you expect.
      placeholder: |
        Expected: ... (treams 0.4.7), rtol 1e-12
        Actual: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fails on
      description: >-
        treams-rs version (`python -c "import treams_rs; print(treams_rs.__version__)"`)
        or commit, plus NumPy, Python and OS.
    validations:
      required: true
