name: Bug report
description: treams-rs fails, crashes or behaves differently from its documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a result that disagrees with treams or another reference, use the
        numerical discrepancy form instead. Report security problems privately:
        https://github.com/yaugenst/treams-rs/security/advisories/new
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what were you trying to do?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: A short, self-contained script that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: The output, including the complete traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        The treams-rs version
        (`python -c "import importlib.metadata as m; print(m.version('treams-rs'))"`),
        the operating system and CPU, the Python version, and the installed extras
        (advect, jax, torch, io) with their versions.
      value: |
        treams-rs:
        OS and CPU:
        Python:
        Extras:
    validations:
      required: true
