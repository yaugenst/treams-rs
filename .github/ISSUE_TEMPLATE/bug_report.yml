name: Bug report
description: treams-rs crashes, errors or contradicts its documentation, or a test or CI job fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Wrong numbers against treams or a reference: use the numerical discrepancy form.
        Security problems: [report privately](https://github.com/yaugenst/treams-rs/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What is wrong
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproduce
      description: >-
        Exact shell commands or a minimal self-contained Python script that fails
        on the version below. For a test failure: the failing command and the
        pinned seed or input.
      render: text
      placeholder: |
        python -c "import treams_rs as tr; ..."
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: One line each; paste only the decisive output lines.
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fails on
      description: >-
        treams-rs version (`python -c "import treams_rs; print(treams_rs.__version__)"`)
        or commit, plus OS and Python if relevant.
    validations:
      required: true
