name: Feature request
description: Propose a new capability or a change to the API.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What you want to compute or do that treams-rs does not support well, in
        one or two sentences. Name the treams counterpart if there is one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: A short code sketch of the API you have in mind, in a fenced code block.
    validations:
      required: true
