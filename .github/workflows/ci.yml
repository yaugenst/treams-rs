name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Formatting, Clippy, native tests and rustdoc do not depend on the
    # Python version; PyO3 only needs an interpreter to configure the build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@89428adc381502888d30f3ce6abbb7ea52739d01
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.3"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
        with:
          just-version: "1.48.0"
      - name: Create the PyO3 interpreter environment
        run: uv venv --python 3.13
      - name: Verify Rust
        run: just ci-rust

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 runs the suite on one thread, 3.13 on every CPU, so both
        # the serial and the parallel paths are tested at no extra cost.
        include:
          - python-version: "3.12"
            threads: "1"
          - python-version: "3.13"
            threads: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@89428adc381502888d30f3ce6abbb7ea52739d01
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: python-${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.3"
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
        with:
          just-version: "1.48.0"
      - name: Install dependencies
        # `just ci-python` builds the development extension; installing the
        # project here would compile an unused optimized build first.
        run: |
          uv sync --locked --no-install-project --group dev --extra jax --python '${{ matrix.python-version }}'
          uv pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu'
      - name: Verify Python
        # 100 Hypothesis examples per property instead of the local default of 30.
        env:
          HYPOTHESIS_PROFILE: ci
          TREAMS_RS_NUM_THREADS: ${{ matrix.threads }}
        run: just ci-python
      - name: Verify clean wheel
        run: just check-wheel
