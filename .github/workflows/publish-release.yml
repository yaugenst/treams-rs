name: Publish release

on:
  repository_dispatch:
    types: [release]

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Build release candidate
    uses: ./.github/workflows/release-candidate.yml
    with:
      release_tag: ${{ github.event.client_payload.tag }}
      target: testpypi
    permissions:
      actions: read
      contents: read

  # TestPyPI is advisory: it has no service-level agreement, so its steps continue on
  # error and an outage there cannot block a release. The distributions were already
  # smoke-tested in clean environments, and verify-pypi checks the real index. Dispatch
  # with client_payload[skip_testpypi]=true to skip it. Jobs keep plain needs without
  # conditions, so a real failure anywhere else still stops the release.
  testpypi:
    name: Publish candidate to TestPyPI
    needs: candidate
    runs-on: ubuntu-22.04
    outputs:
      upload: ${{ steps.publish.outcome }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/treams-rs
    permissions:
      id-token: write # TestPyPI trusted publishing exchanges the OIDC identity
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treams-rs-release-distributions-${{ needs.candidate.outputs.version }}
          path: dist

      - name: Publish distributions with trusted publishing
        id: publish
        if: github.event.client_payload.skip_testpypi != 'true'
        continue-on-error: true
        # A hung upload would otherwise be cancelled at the job timeout, which
        # continue-on-error does not cover; a step timeout counts as a failure.
        timeout-minutes: 15
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI installation
    needs: [candidate, testpypi]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.source_revision }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version-file: pyproject.toml

      - name: Install and smoke-test the candidate
        id: install
        if: needs.testpypi.outputs.upload == 'success'
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          # Python 3.14 is the newest interpreter with wheels for every extra
          # exercised here (h5py has none for 3.15 yet).
          uv venv .testpypi-smoke --python 3.14
          uv pip install \
            --python .testpypi-smoke/bin/python \
            --no-cache \
            --only-binary :all: \
            -r pyproject.toml \
            --extra advect \
            --extra io
          uv pip install \
            --python .testpypi-smoke/bin/python \
            --no-cache \
            --no-deps \
            --only-binary :all: \
            --index-url https://test.pypi.org/simple/ \
            "treams-rs==$RELEASE_VERSION"
          uv pip check --python .testpypi-smoke/bin/python
          .testpypi-smoke/bin/python scripts/smoke_wheel_install.py advect io

      - name: Record the candidate awaiting promotion
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_REVISION: ${{ needs.candidate.outputs.source_revision }}
          TESTPYPI_UPLOAD: ${{ needs.testpypi.outputs.upload }}
          TESTPYPI_INSTALL: ${{ steps.install.outcome }}
        run: |
          {
            echo "## Candidate ready for promotion"
            echo "Tag \`$RELEASE_TAG\` at \`$SOURCE_REVISION\`, then approve production."
            echo "TestPyPI (advisory): upload $TESTPYPI_UPLOAD, installation $TESTPYPI_INSTALL."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Approve production release
    needs: [candidate, verify-testpypi]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.source_revision }}

      - name: Verify the operator-created release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_REVISION: ${{ needs.candidate.outputs.source_revision }}
        run: |
          tag_revision="$(
            bash .github/scripts/verify-release-state.sh \
              "$SOURCE_REVISION" "$GH_REPO" pypi "$RELEASE_TAG"
          )"
          if [[ "$tag_revision" != "$SOURCE_REVISION" ]]; then
            echo "Release tag $RELEASE_TAG does not target the tested candidate" >&2
            exit 1
          fi

  docs:
    name: Publish versioned documentation
    needs: [candidate, promote]
    uses: ./.github/workflows/docs.yml
    with:
      source_revision: ${{ needs.candidate.outputs.source_revision }}
      version: ${{ needs.candidate.outputs.version }}
    permissions:
      contents: write # retain versioned documentation on gh-pages
      pages: write
      id-token: write

  github-release:
    name: Publish GitHub release
    needs: [candidate, docs]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # this job creates the GitHub release
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treams-rs-release-distributions-${{ needs.candidate.outputs.version }}
          path: release

      - name: Download release provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treams-rs-release-provenance-${{ needs.candidate.outputs.version }}
          path: release

      - name: Confirm the tag still targets the qualified commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_REVISION: ${{ needs.candidate.outputs.source_revision }}
        run: |
          tag_object="$(
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha'
          )"
          current_revision="$(
            gh api "repos/$GH_REPO/git/tags/$tag_object" \
              --jq 'select(.object.type == "commit") | .object.sha'
          )"
          if [[ "$current_revision" != "$SOURCE_REVISION" ]]; then
            echo "Release tag $RELEASE_TAG moved after qualification" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/*
          --verify-tag
          --generate-notes
          --title "treams-rs $RELEASE_VERSION"

  pypi:
    name: Publish to PyPI
    needs: [candidate, github-release]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/treams-rs
    permissions:
      id-token: write # PyPI trusted publishing exchanges the OIDC identity
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: treams-rs-release-distributions-${{ needs.candidate.outputs.version }}
          path: dist

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  verify-pypi:
    name: Verify public installation
    needs: [candidate, pypi]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.source_revision }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version-file: pyproject.toml

      - name: Install the published package
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          uv venv .pypi-smoke --python 3.15
          uv pip install \
            --python .pypi-smoke/bin/python \
            --no-cache \
            --only-binary :all: \
            "treams-rs==$RELEASE_VERSION"
          .pypi-smoke/bin/python scripts/smoke_wheel_install.py base
