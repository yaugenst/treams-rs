name: Formal

on:
  pull_request:
    paths:
      - formal/**
      - crates/treams-core/src/cluster/interaction.rs
      - crates/treams-core/src/lattice/direct.rs
      - crates/treams-core/src/lattice/geometry.rs
      - crates/treams-core/src/lattice/shells.rs
      - crates/treams-core/src/linalg/mod.rs
      - crates/treams-core/src/special/harmonics.rs
      - crates/treams-core/src/special/wigner.rs
      - crates/treams-core/src/sw/coupling.rs
      - crates/treams-core/src/sw/plan.rs
      - justfile
      - .github/workflows/formal.yml
  push:
    branches: [main]
    paths:
      - formal/**
      - crates/treams-core/src/cluster/interaction.rs
      - crates/treams-core/src/lattice/direct.rs
      - crates/treams-core/src/lattice/geometry.rs
      - crates/treams-core/src/lattice/shells.rs
      - crates/treams-core/src/linalg/mod.rs
      - crates/treams-core/src/special/harmonics.rs
      - crates/treams-core/src/special/wigner.rs
      - crates/treams-core/src/sw/coupling.rs
      - crates/treams-core/src/sw/plan.rs
      - justfile
      - .github/workflows/formal.yml

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
        with:
          just-version: "1.48.0"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs and reference outputs
        run: just formal
