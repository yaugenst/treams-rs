[workspace]
members = [ "crates/treams-core", "crates/treams-py" ]
default-members = [ "crates/treams-core" ]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "A Rust port of treams with a Python interface and analytic gradients."
authors = [ "treams-rs contributors" ]
readme = "README.md"
repository = "https://github.com/yaugenst/treams-rs"
homepage = "https://yaugenst.github.io/treams-rs/latest/"
documentation = "https://yaugenst.github.io/treams-rs/latest/rust/treams_core/"
keywords = [ "t-matrix", "electromagnetics", "scattering", "photonics", "autodiff" ]
categories = [ "science" ]

[workspace.dependencies]
faer = { version = "0.24.4", default-features = false, features = [ "std", "linalg" ] }
rayon = "1"
complex-bessel = "0.3.0"
errorfunctions = "0.2.0"
libm = "0.2"
nalgebra = { version = "0.35", default-features = false, features = [ "std" ] }
num-complex = "0.4"
numpy = "0.29"
pyo3 = { version = "0.29", features = [ "num-complex" ] }
thiserror = "2"
treams-core = { path = "crates/treams-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
# Stays on for new code, which indexes through iterators or checked access. A
# numerical module that validates its indices on entry opts out once, with a
# module-level `#![allow(clippy::indexing_slicing)] // <why the indices are in range>`;
# the reason comment is required. Tests may index freely (clippy.toml).
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
float_cmp = "warn"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
many_single_char_names = "allow"
missing_const_for_fn = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
suboptimal_flops = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
use_self = "allow"

# `just rust-test` and the development extension use the dev profile. Light
# optimization keeps debug assertions and overflow checks but runs the numerical
# tests several times faster; dependencies are optimized further.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Index arithmetic that overflows panics instead of silently wrapping to a wrong
# index; the hot loops are float-bound, so the check costs nothing measurable.
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
